<script>
  (async function injectHF(){
    const [H, F] = await Promise.all([
      fetch('assets/partials/header.html').then(r=>r.text()),
      fetch('assets/partials/footer.html').then(r=>r.text())
    ]);
    document.getElementById('header').innerHTML = H;
    document.getElementById('footer').innerHTML = F;
    window.ppInitHeader && window.ppInitHeader();
    window.ppCartInit && window.ppCartInit();
  })();
</script>

    <script>
    (async function initPDP(){
      // 1) leer slug/id
      const params = new URLSearchParams(location.search);
      const slug = params.get('slug') || params.get('id');

      // 2) cargar catálogo
      const res = await fetch('assets/data/catalog.json', { cache:'no-store' });
      const data = await res.json();
      const items = Array.isArray(data) ? data : (data.items || []);
      const prod = items.find(p => (p.slug || p.id) === slug) || items[0];
      if(!prod){ console.warn('[PDP] Producto no encontrado'); return; }
window.__pdp = prod;
      // 3) pintar textos básicos
      const $ = (sel)=>document.querySelector(sel);
      $('#pTitle').textContent = prod.title || 'Producto';
      $('#pPrice').textContent = (typeof prod.price==='number') ? window.ppCart.money(prod.price) : (prod.price || '—');
      $('#pShort').textContent = prod.short || (prod.collection || '');

      // migas
      $('#pCrumb').textContent = prod.title || 'Product';

      // 4) Galería (dedupe + sin duplicar activa en thumbs + zoom completo)
// 4) Galería — estilo Loewe: 2 mains lado-a-lado + thumbs + zoom
const rawImages = (prod.images && prod.images.length) ? prod.images : ['assets/img/products/placeholder.jpg'];
const images = [...new Map(rawImages.map(src => [src, src])).values()]; // dedupe

const hero   = document.querySelector('.pdp-hero');
const thumbs = document.querySelector('#pThumbs');

// pinta 2 imágenes grandes (si solo hay una, pinta una)
const mains = images.slice(0, 2);
hero.innerHTML = mains.map((src, idx) => `
  <button class="hero-cell" data-i="${idx}" aria-label="Ampliar">
    <img class="hero-img" src="${src}" alt="">
  </button>
`).join('');

// pinta las miniaturas con el resto (a partir de la tercera)
const startThumb = mains.length;
thumbs.innerHTML = images.slice(startThumb).map((src, k) =>
  `<img class="pdp-thumb" data-i="${k + startThumb}" src="${src}" alt="">`
).join('');

// === Lightbox (aprovechamos tu zoom existente) ===
const Z = {
  el     : document.getElementById('pdpZoom'),
  img    : document.getElementById('pdpZoomImg'),
  thumbs : document.getElementById('pdpZoomThumbs'),
  i      : 0
};

function zoomPaint(idx){
  Z.i = idx;
  Z.img.src = images[idx] || images[0];
  Z.thumbs.innerHTML = images.map((src, i) =>
    `<li class="${i===idx?'is-active':''}" data-i="${i}"><img src="${src}" alt=""></li>`
  ).join('');
}
function zoomOpen(idx){ zoomPaint(idx); Z.el.classList.remove('hidden'); Z.el.setAttribute('aria-hidden','false'); }
function zoomClose(){ Z.el.classList.add('hidden'); Z.el.setAttribute('aria-hidden','true'); }
document.getElementById('pdpZoomClose')?.addEventListener('click', zoomClose);
Z.el.querySelector('.lb-backdrop')?.addEventListener('click', zoomClose);

// Click en la hero: si es zona, navega; si no, abre zoom
document.querySelector('.pdp-hero')?.addEventListener('click', (e)=>{
  if (e.target.closest('.g-prev')) { paint((i-1+images.length)%images.length); return; }
  if (e.target.closest('.g-next')) { paint((i+1)%images.length); return; }
  zoomOpen(i);
});

// Controles del zoom y thumbs en zoom
document.getElementById('pdpZoomPrev')?.addEventListener('click', ()=> zoomPaint((Z.i - 1 + images.length) % images.length));
document.getElementById('pdpZoomNext')?.addEventListener('click', ()=> zoomPaint((Z.i + 1) % images.length));
Z.thumbs?.addEventListener('click', (e)=>{
  const li = e.target.closest('li[data-i]'); if(!li) return;
  zoomPaint(+li.dataset.i);
});
// Teclas ← → y ESC en el zoom
document.addEventListener('keydown', (e)=>{
  if (Z.el.classList.contains('hidden')) return;
  if (e.key === 'ArrowLeft')  zoomPaint((Z.i - 1 + images.length) % images.length);
  if (e.key === 'ArrowRight') zoomPaint((Z.i + 1) % images.length);
  if (e.key === 'Escape')     zoomClose();
});
Z.thumbs?.addEventListener('click', e=>{
  const li = e.target.closest('li[data-i]'); if(!li) return;
  zoomPaint(+li.dataset.i);
});

// abrir zoom:
hero.addEventListener('click', e=>{
  const b = e.target.closest('.hero-cell[data-i]'); if(!b) return;
  zoomOpen(+b.dataset.i);
});
thumbs.addEventListener('click', e=>{
  const t = e.target.closest('.pdp-thumb[data-i]'); if(!t) return;
  zoomOpen(+t.dataset.i);
});




      // 5) tallas y colores (opcionales)
// Datos (o usa los que ya obtienes del JSON)
// Datos de ejemplo (usa los de tu JSON si existen)
const sizes  = (prod.sizes  && prod.sizes.length)  ? prod.sizes  : ['S','M','L','XL'];
const colors = (prod.colors && prod.colors.length) ? prod.colors : ['Natural','Negro'];

const AD      = document.getElementById('attrDrawer');
const adTitle = document.getElementById('adTitle');
const adBody  = document.getElementById('adBody');

let triggerEl = null;                         // enlace que abre el drawer
let selected  = { size:null, color:null };    // estado

function openDrawer(type, el){
  triggerEl = el;
  adTitle.textContent = (type === 'size') ? 'Talla' : 'Color';

  if (type === 'size'){
    adBody.innerHTML = `<div class="opts">` + sizes.map(s =>
      `<button class="opt" data-type="size" data-value="${s}">${s}</button>`
    ).join('') + `</div>`;
  } else {
    adBody.innerHTML = `<div class="opts">` + colors.map(c=>{
      const name = typeof c === 'string' ? c : (c.name || c.title || 'Color');
      const hex  = (typeof c === 'object' && c.hex) ? c.hex : null;
      return `<button class="opt" data-type="color" data-value="${name}">
                ${hex?`<span class="swatch" style="background:${hex}"></span>`:''}${name}
              </button>`;
    }).join('') + `</div>`;
  }

  AD.classList.remove('closing');
  AD.classList.add('open');
  AD.setAttribute('aria-hidden','false');
  document.body.classList.add('drawer-open');
}

function closeDrawer(){
  AD.classList.add('closing');
  setTimeout(()=>{
    AD.classList.remove('open','closing');
    AD.setAttribute('aria-hidden','true');
    document.body.classList.remove('drawer-open');
  }, 220);
}

// abrir desde enlaces Talla/Color
document.querySelectorAll('.attr-link[data-attr]').forEach(a=>{
  a.addEventListener('click', e=>{
    e.preventDefault();
    openDrawer(a.dataset.attr, a);
  });
});

// interactuar dentro del drawer
AD.addEventListener('click', (e)=>{
  if (e.target.closest('[data-ad-close]')) return closeDrawer();

  const opt = e.target.closest('.opt[data-type][data-value]');
  if (!opt) return;

  const t = opt.dataset.type;
  const v = opt.dataset.value;
  selected[t] = v;

  // marca activa
  AD.querySelectorAll('.opt').forEach(o=>o.classList.remove('is-active'));
  opt.classList.add('is-active');

  // refleja selección en el enlace (sin spans)
  if (triggerEl) triggerEl.dataset.selected = v;

  // cerrar tras elegir (como hace Loewe)
  setTimeout(closeDrawer, 120);
});

// ESC y click en backdrop
document.addEventListener('keydown', e=>{
  if (e.key === 'Escape' && AD.classList.contains('open')) closeDrawer();
});
// --- 6) Añadir a la cesta ---
const buyForm = document.getElementById('buyForm');
const qtyInput = document.getElementById('qty');

buyForm?.addEventListener('submit', (e) => {
  e.preventDefault();

  const p = window.__pdp || {};
  const qty = Math.max(1, parseInt(qtyInput?.value || '1', 10));
  const price = (typeof p.price === 'number')
    ? p.price
    : Number(String(p.price || '0')
        .replace(/[^\d.,]/g, '')
        .replace(/\./g, '')
        .replace(',', '.')) || 0;

  const opts = {};
  if (selected.size)  opts.size  = selected.size;
  if (selected.color) opts.color = selected.color;

  const img = Array.isArray(p.images) && p.images.length ? p.images[0] : '';

  window.ppCart?.add({
    id:   p.id || p.slug || p.title,
    title:p.title || 'Producto',
    price,
    qty,
    image: img,
    options: opts
  });

  window.ppCart?.open?.();
});

AD.querySelector('.ad-backdrop').addEventListener('click', closeDrawer);
   
    })();
  </script>
  
<script id="pdpSchema" type="application/ld+json"></script>

<script>
setTimeout(() => {
  try {
    const p = window.__pdp;
    if(!p) return;
    const schema = {
      "@context":"https://schema.org",
      "@type":"Product",
      "name": p.title || "Producto Prophetia",
      "image": Array.isArray(p.images)? p.images : [p.images],
      "brand": { "@type":"Brand","name":"PROPHETIA" },
      "sku": p.id || p.slug,
      "offers":{
        "@type":"Offer",
        "priceCurrency":"EUR",
        "price": String(p.price || ""),
        "availability": p.inStock ? "https://schema.org/InStock" : "https://schema.org/OutOfStock",
        "url": location.href
      }
    };
    document.getElementById('pdpSchema').textContent = JSON.stringify(schema);
  } catch(e){ console.warn('schema fail', e); }
}, 200);
</script>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — PROPHETIA</title>
  
</head>
<link rel="stylesheet" href="assets/css/style.css" />

<body>
  <div id="header"></div>

  <main class="four-wrap" style="min-height:70vh;display:grid;place-items:center;padding:40px 16px">
    <div class="four-card" style="max-width:720px;background:#fff;border:1px solid var(--hair);border-radius:18px;padding:36px;box-shadow:var(--shadow-sm);text-align:center">
      <h1 style="font-family:'Playfair Display',serif;font-size:44px;margin:0 0 6px">404</h1>
      <p style="color:var(--muted);margin:0 0 16px">Página no encontrada. Puede que el mito se haya escondido entre columnas griegas.</p>
      <a class="btn-primary" href="colecciones.html">Ver colecciones</a>
    </div>
  </main>

  <div id="footer"></div>

  <script src="assets/js/script.js" defer></script>
  <script>
    (async function injectHF(){
      const [H,F]=await Promise.all([
        fetch('assets/partials/header.html').then(r=>r.text()),
        fetch('assets/partials/footer.html').then(r=>r.text())
      ]);
      document.getElementById('header').innerHTML=H;
      document.getElementById('footer').innerHTML=F;
      window.ppInitHeader && window.ppInitHeader();
    })();
  </script>
</body>

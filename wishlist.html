<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PROPHETIA · Mi selección</title>


  <!-- CSS principal -->
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- Tipografías: Playfair/Inter que usas, y Cinzel si la activas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;700&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="wishlist-page">
  <!-- ====================================================
       PARCIALES (Header/Footer) – los rellenas por JS (igual que camisetas.html)
       ==================================================== -->
  <div id="header"></div>
 

<!-- ======================= FRANJA DEL LOGO ======================= -->
<div class="brand-band">
  <div class="container">
    <a class="page-logo" href="index.html" aria-label="Inicio Prophetia">
      <img src="assets/img/logo/propnegro.png" alt="PROPHETIA">
    </a>
  </div>
</div>
  <main class="wl-layout">
    <!-- ====== HERO / TÍTULO ====== -->
    <section class="wl-hero container">
      <h1 class="wl-title">Mi selección</h1>
      <p class="wl-sub">Tienes <span id="wlCount">0</span> productos en tu selección</p>
    </section>

    <!-- ====== RESULTADOS ====== -->
    <section class="wl-results">
      <!-- Estado vacío -->
      <div id="wlEmpty" class="wl-empty" hidden>
        <p class="wl-empty-title">Tu selección está vacía</p>
        <p class="wl-empty-sub">Explora el catálogo y añade tus favoritos.</p>
        <a class="btn" href="camisetas.html">Ver camisetas</a>
      </div>

      <!-- Grid de guardados -->
      <div id="gridWishlist" class="products-grid wishlist-grid"></div>
    </section>
  </main>

  <div id="footer"></div>

  <!-- ====== SCRIPTS ====== -->
  <!-- Tu init de parciales/header/footer, igual que en camisetas.html -->
  <script src="assets/js/header-init.js" defer></script>
  <script src="assets/js/script.js" defer></script>

  <!-- Wishlist render mínimo -->
  <!-- Inyección de parciales + init header + carrito -->
   <!-- ====== CART: overlay + drawer ====== -->
<div id="cartOverlay" class="cart-overlay" hidden></div>

<aside id="cartDrawer" class="cart-drawer" aria-hidden="true" role="dialog" aria-label="Cesta">
  <div class="cart-head">
    <strong>Cesta · <span id="cartCount">0</span></strong>
    <button id="cartClose" class="cart-close" aria-label="Cerrar">✕</button>
  </div>

  <div class="cart-list" id="cartList"></div>

  <div class="cart-foot">
    <div class="cart-total">
      <span>Subtotal</span>
      <strong id="cartSubtotal">0,00 €</strong>
    </div>
    <button class="cart-checkout" id="cartCheckout">Finalizar compra</button>
  </div>
</aside>

<script>
  (async function injectHF(){
    try {
      const [H, F] = await Promise.all([
        fetch('assets/partials/header.html').then(r=>r.text()),
        fetch('assets/partials/footer.html').then(r=>r.text())
      ]);

      const $H = document.getElementById('header');
      const $F = document.getElementById('footer');
      if ($H) $H.innerHTML = H;
      if ($F) $F.innerHTML = F;

      // Inicializaciones que dependen del header inyectado:
      if (window.ppInitHeader) window.ppInitHeader();
      if (window.ppCartInit)   window.ppCartInit();

      window.dispatchEvent(new CustomEvent('partials:ready'));
    } catch(err){
      console.error('Error inyectando parciales:', err);
    }
  })();
</script>
<script src="assets/js/header-init.js" defer></script>
<script src="assets/js/script.js" defer></script>
<script src="assets/js/cart.js"></script>

</body>
</html>

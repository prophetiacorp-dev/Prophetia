<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hoodies — PROPHETIA</title>
  <link rel="icon" href="favicon.ico" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="hoodies-page" data-page="hoodies">
  
  <div id="header"></div>

 <main id="swup" class="cat-layout" data-page="hoodies">
  <!-- ======================= FRANJA DEL LOGO ======================= -->
  <div class="brand-band">
    <div class="container">
      <a class="page-logo" href="index.html" aria-label="Inicio Prophetia">
        <img src="assets/img/logo/propnegro.png" alt="PROPHETIA">
      </a>
    </div>
  </div>
  <!-- =============================================================== -->

  <!-- ===================== Resultados (centro) ===================== -->
  <section class="cat-results">

    <!-- ======= TOOLBAR ======= -->
    <div class="cat-toolbar container">
      <div class="toolbar-left">
        <button class="btn ghost" type="button" data-filters-open>Filtros</button>
        <a href="#" class="pill pill--active">Todos</a>
        <a href="#" class="pill">Oversized</a>
        <a href="#" class="pill">Regular</a>
      </div>

      <div class="toolbar-right">
        <div class="sort-wrap">
          <button class="sort-label" type="button" aria-hidden="true" tabindex="-1">Ordenar por</button>
          <select id="hoodiesSort" aria-label="Ordenar por">
            <option value="relevance" selected>Relevancia</option>
            <option value="price_asc">Precio: menor a mayor</option>
            <option value="price_desc">Precio: mayor a menor</option>
            <option value="newest">Novedades</option>
          </select>
        </div>

        <label class="stock-toggle">
          <input type="checkbox" id="hoodiesStockOnly" />
          <span>En stock</span>
        </label>
      </div>
    </div>
    <!-- ======= FIN TOOLBAR ======= -->

    <!-- ====== OVERLAY + DRAWER (mismo patrón que camisetas) ====== -->
    <div class="filters-overlay" hidden data-filters-overlay></div>

    <aside class="filters-drawer"
           hidden
           role="dialog"
           aria-modal="true"
           aria-labelledby="filtersTitleHoodies"
           id="filtersDrawerHoodies"
           data-filters-drawer>

      <header class="filters-head">
        <h3 id="filtersTitleHoodies">Filtros</h3>
        <button class="filters-close" type="button" aria-label="Cerrar filtros" data-filters-close>✕</button>
      </header>

      <nav class="filters-tabs" role="tablist" aria-label="Tipos de filtro">
        <button class="filters-tab active"
                role="tab"
                aria-selected="true"
                aria-controls="tabColorsH"
                id="tabColorsBtnH"
                type="button">
          Color
        </button>

        <button class="filters-tab"
                role="tab"
                aria-selected="false"
                aria-controls="tabSizesH"
                id="tabSizesBtnH"
                type="button">
          Talla
        </button>
      </nav>

      <!-- Panel: COLORES -->
      <section class="filters-panel" id="tabColorsH" role="tabpanel" aria-labelledby="tabColorsBtnH">
        <ul class="filters-list colors">
          <li><label><input type="checkbox" value="negro"><span class="swatch" style="--sw:#111"></span> Negro <span class="count" data-count-for="negro">–</span></label></li>
          <li><label><input type="checkbox" value="blanco"><span class="swatch" style="--sw:#EEE"></span> Blanco <span class="count" data-count-for="blanco">–</span></label></li>
          <li><label><input type="checkbox" value="gris"><span class="swatch" style="--sw:#9E9E9E"></span> Gris <span class="count" data-count-for="gris">–</span></label></li>
          <li><label><input type="checkbox" value="azul"><span class="swatch" style="--sw:#1E66D0"></span> Azul <span class="count" data-count-for="azul">–</span></label></li>
          <!-- añade los que necesites -->
        </ul>
      </section>

      <!-- Panel: TALLAS -->
      <section class="filters-panel hidden" id="tabSizesH" role="tabpanel" aria-labelledby="tabSizesBtnH">
        <ul class="filters-list">
          <li><label><input type="checkbox" value="S"> S <span class="count" data-count-for="S">–</span></label></li>
          <li><label><input type="checkbox" value="M"> M <span class="count" data-count-for="M">–</span></label></li>
          <li><label><input type="checkbox" value="L"> L <span class="count" data-count-for="L">–</span></label></li>
          <li><label><input type="checkbox" value="XL"> XL <span class="count" data-count-for="XL">–</span></label></li>
          <!-- etc -->
        </ul>
      </section>

      <footer class="filters-foot">
        <button class="btn-pill" id="clearFiltersHoodies" type="button">Limpiar</button>
        <button class="btn-primary grow" id="applyFiltersHoodies" type="button">
          Ver <span id="hoodiesCount">0</span> resultados
        </button>
      </footer>
    </aside>

    <!-- ===== GRID (ID propio) ===== -->
    <div class="products-grid catalog" id="gridHoodies"></div>
  </section>
</main>



  <div id="footer"></div>
  <script src="assets/js/script.js"></script>
  <script>
  (async function injectHF(){
    try{
      const [H, F] = await Promise.all([
        fetch('assets/partials/header.html').then(r=>r.text()),
        fetch('assets/partials/footer.html').then(r=>r.text())
      ]);
      const $H = document.getElementById('header');
      const $F = document.getElementById('footer');
      if ($H) $H.innerHTML = H;
      if ($F) $F.innerHTML = F;

      // Header + AUDIO (si entran directo a hoodies.html)
      window.ppInitHeader && window.ppInitHeader();
      window.ppInitAudio  && window.ppInitAudio();

      // Pintar grid (misma API que camisetas)
      if (window.ppInitCatalog) {
        window.ppInitCatalog({
          target: '#gridHoodies',
          category: 'hoodies'
        });
      }

      window.dispatchEvent(new CustomEvent('partials:ready'));
    }catch(e){ console.error('Error parciales:', e); }
  })();
</script>

</body>
</html>

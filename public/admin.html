<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin · PROPHETIA</title>
  <meta name="robots" content="noindex,nofollow">

  <style>
    :root{
      --bg:#0b0c0f; --card:#121420; --muted:#8e95a7; --text:#eef0f6;
      --line:rgba(255,255,255,.10); --accent:#d7c7a6;
      --good:#6ee7b7; --bad:#fb7185;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 800px at 20% -10%, rgba(215,199,166,.14), transparent 55%),
                  radial-gradient(900px 700px at 90% 0%, rgba(255,255,255,.06), transparent 55%),
                  var(--bg);
      color:var(--text);
    }
    .wrap{ max-width:1200px; margin:0 auto; padding:22px 16px 60px; }

    .top{
      display:flex; align-items:flex-end; justify-content:space-between; gap:14px;
      padding: 14px 14px 18px; border:1px solid var(--line); border-radius:18px;
      background: linear-gradient(180deg, rgba(255,255,255,.04), transparent);
    }
    .brand{ display:flex; flex-direction:column; gap:6px; }
    .brand h1{ margin:0; font-family: "Playfair Display", Georgia, serif; font-weight:600; letter-spacing:.08em; font-size:22px; }
    .brand p{ margin:0; color:var(--muted); font-size:13px; letter-spacing:.06em; text-transform:uppercase; }

    .grid{ margin-top:14px; display:grid; grid-template-columns: 1fr; gap:14px; }

    .card{
      border:1px solid var(--line); border-radius:18px; background:rgba(18,20,32,.72);
      overflow:hidden;
    }
    .card h2{
      margin:0; padding:14px 14px 12px; font-size:13px; letter-spacing:.12em;
      text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--line);
    }
    .card .body{ padding:14px; display:grid; gap:12px; }

    label{ display:grid; gap:6px; font-size:12px; color:var(--muted); letter-spacing:.04em; }
    input{
      width:100%;
      padding:10px 10px;
      border-radius:12px;
      border:1px solid var(--line);
      background: rgba(255,255,255,.03);
      color: var(--text);
      outline: none;
      font-size: 14px;
    }

    .row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 10px; border-radius:999px; border:1px solid var(--line);
      background: rgba(255,255,255,.03); color:var(--muted); font-size:12px;
    }
    .status.good{ color: var(--good); }
    .status.bad{ color: var(--bad); }

    button{
      appearance:none; border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--text);
      padding:10px 12px; border-radius:12px; cursor:pointer; font-weight:600;
    }
    button:hover{ background:rgba(255,255,255,.06); }
    button.primary{ border-color: rgba(215,199,166,.5); background: rgba(215,199,166,.14); }
    button.primary:hover{ background: rgba(215,199,166,.20); }
    button.danger{ border-color: rgba(251,113,133,.45); background: rgba(251,113,133,.12); }

    .hint{ font-size:12px; color:var(--muted); line-height:1.45; }
    .hide{ display:none!important; }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>
  <div class="wrap">

    <div class="top">
      <div class="brand">
        <h1>PROPHETIA · Admin</h1>
        <p>CMS · Firestore</p>
      </div>
    </div>

    <!-- ===== GATE: Login ===== -->
    <section id="adminGate" class="card" style="margin-top:14px;">
      <h2>Acceso</h2>
      <div class="body">
        <div class="pill">
          Estado: <span id="adminWho" class="status">No autenticado</span>
        </div>
        <div class="hint">
          Panel protegido con Firebase Auth. Solo usuarios autorizados pueden editar.
        </div>
        <div class="row">
          <button id="btnLogin" class="primary" type="button">Iniciar sesión con Google</button>
          <button id="btnLogout" class="danger" type="button">Cerrar sesión</button>
        </div>
      </div>
    </section>

    <!-- ===== APP: Admin real (oculto hasta login) ===== -->
    <div id="adminApp" class="hide">
      <div class="grid">

        <section class="card">
          <h2>Home CMS · Firestore (site/home)</h2>
          <div class="body">
            <div class="pill">
              Estado: <span id="homeStatus" class="status">—</span>
            </div>

            <label>Hero title (herotitle)
              <input id="homeTitle" placeholder="PROPHETIA">
            </label>

            <label>Hero subtitle (herosubtitle)
              <input id="homeSubtitle" placeholder="Silent Luxury Mediterráneo">
            </label>

            <label>Hero CTA (heroCTA)
              <input id="homeCta" placeholder="Descubrir colección">
            </label>

            <div class="row">
              <button id="btnHomeLoad" type="button">Recargar</button>
              <button id="btnHomeSave" class="primary" type="button">Guardar cambios</button>
            </div>

            <div class="hint">
              Se guarda en Firestore y la home lo escucha en tiempo real.
            </div>
          </div>
        </section>

      </div>
    </div>

  </div>

  <script type="module" src="assets/js/admin-firebase.js"></script>
</body>
</html>

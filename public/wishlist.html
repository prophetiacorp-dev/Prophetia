  <link rel="stylesheet" href="assets/css/header.css">

  <link rel="stylesheet" href="assets/css/home.css">
  <link rel="stylesheet" href="assets/css/tiles.css">

  <!-- CATÁLOGO / PRODUCTOS -->
  <link rel="stylesheet" href="assets/css/catalog.css">
  <link rel="stylesheet" href="assets/css/plp.css">
  <link rel="stylesheet" href="assets/css/products.css">
  <link rel="stylesheet" href="assets/css/pdp.css">

  <!-- SECCIONES ESPECÍFICAS -->

  <link rel="stylesheet" href="assets/css/auth.css">

  <link rel="stylesheet" href="/assets/css/mobile-shell.css?v=20260724-mobile-parity1" data-pp-mobile-shell>

<body class="wishlist-page">
  <!-- HEADER parcial (se inyecta por JS) -->
  <div id="header"></div>

  <!-- ===== FRANJA LOGO PROPHETIA ===== -->
  <div class="brand-band">
    <div class="container">
      <a class="page-logo" href="/home" aria-label="Inicio Prophetia">
        <img src="assets/img/logo/propnegro.png" alt="PROPHETIA">
      </a>
    </div>
  </div>

<!-- ===== Sub-nav wishlist (Mi selección / Puede que te guste) ===== -->
<nav class="wl-nav" aria-label="Wishlist secciones">
  <div class="container">
    <ul class="wl-nav__list">
      <li>
        <a
          class="active"
          href="#selection"
          aria-current="page"
          aria-controls="selection"
          data-wl-tab="selection"
        >
          Mi selección
        </a>
      </li>

      <li>
        <a
          href="#recommended"
          aria-controls="recommended"
          data-wl-tab="recommended"
        >
          Puede que te guste
        </a>
      </li>
    </ul>
  </div>
</nav>

  <!-- ===== MAIN ===== -->
  <main class="wl wl-layout">
    <!-- HERO / contador -->
    <section class="wl-hero container">
      <h1 class="wl-title sr-only">Mi selección</h1>
      <p class="wl-sub" aria-live="polite">
        Tienes <span id="wlCount">0</span> productos en tu selección
      </p>
    </section>

    <!-- RECOMENDACIONES -->
<section
  class="wl-recommended"
  id="recommended"
  data-wishlist-recommended
  hidden
>
  <p class="wl-recommended__kicker">PROPHETIA SELECTION</p>

  <h2 class="wl-recommended__title">
    Puede que te guste
  </h2>

  <p class="wl-recommended__text" data-wishlist-recommended-text>
    Explora piezas seleccionadas según tu experiencia Prophetia.
  </p>

  <div class="wl-recommended__links" data-wishlist-recommended-links>
    <!-- JS pinta aquí las recomendaciones -->
  </div>
</section>

    <!-- RESULTADOS -->
    <section class="wl-results" id="selection" data-wishlist-selection>
      <!-- Estado vacío “Tu selección está vacía” -->
      <div id="wlEmpty" class="wl-empty" hidden>
  <p class="wl-empty-title">Tu selección está vacía</p>
  <p class="wl-empty-sub">Explora nuestras categorías y añade tus favoritos.</p>

  <div class="wl-empty-actions">
    <a class="btn btn--ghost" href="/mujer">Mujer</a>
    <a class="btn btn--ghost" href="/hombre">Hombre</a>
    <a class="btn btn--ghost" href="/colecciones">Colecciones</a>
  </div>
</div>


      <!-- Grid de guardados -->
      <div id="gridWishlist" class="products-grid wishlist-grid"></div>
    </section>
  </main>



    <!-- FOOTER parcial -->
  <div id="footer"></div>

  <!-- Área para popups -->
  <div id="popup-area"></div>



  <!-- JS global Prophetia · IGUAL QUE EN MUJER -->
<script src="/assets/js/wishlist.js" defer></script>

<script type="module" src="/assets/js/firebase-init.js"></script>
<script type="module" src="/assets/js/firebase-auth.js"></script>
<script defer src="/assets/js/header-init.js?v=20260724-mobile-parity1"></script>
<script src="/assets/js/popup.js" defer></script>
<script src="/assets/js/cookies.js" defer></script>
<script src="/assets/js/cart.js" defer></script>

</body>
</html>

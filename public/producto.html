<!-- =======================================================
     BRAND BAND — Logo Prophetia (igual que en camisetas)
     ======================================================= -->
<!-- ===== FRANJA DEL LOGO (idéntica a camisetas) ===== -->
<div class="brand-band">
  <div class="container">
    <a class="page-logo" href="/home" aria-label="Inicio Prophetia">
      <img src="assets/img/logo/propnegro.svg" alt="PROPHETIA">
    </a>
  </div>
</div>


  <div class="product-wrap container">


<!-- Galería de imágenes del producto -->
<section class="pdp-gallery" aria-label="Galería de producto">
  <div id="pThumbs" class="pdp-thumbs" aria-label="Miniaturas"></div>
  <div class="pdp-hero" id="pdpStack" aria-label="Imágenes del producto"></div>
</section>


    <!-- Panel derecha -->
    <aside class="pdp-panel" id="pInfo">
      <nav class="pdp-breadcrumb" aria-label="breadcrumbs"></nav>


      <h1 id="pTitle" class="pdp-title">Producto</h1>
      <p id="pShort" class="pdp-short"></p>

      <div class="pdp-purchase">
       

        <!-- Atributos (Prophetia-like) -->
     <ul class="pdp-attrs" aria-label="Opciones del producto">
  <li class="pdp-attr" id="pdpCutAttr" hidden>
    <button type="button" class="pdp-attr__btn" id="pdpCutBtn" aria-haspopup="dialog">
      <span class="pdp-attr__label">Corte</span>
      <span class="pdp-attr__value" id="pdpCutVal">Seleccionar</span>
    </button>
  </li>

  <li class="pdp-attr" id="pdpVersionAttr" hidden>
    <button type="button" class="pdp-attr__btn" id="pdpVersionBtn" aria-haspopup="dialog">
      <span class="pdp-attr__label">Versión</span>
      <span class="pdp-attr__value" id="pdpVersionVal">Seleccionar</span>
    </button>
  </li>

  <li class="pdp-attr">
    <button type="button" class="pdp-attr__btn" id="pdpColorBtn" aria-haspopup="dialog">
      <span class="pdp-attr__label">Color</span>
      <span class="pdp-attr__value" id="pdpColorVal">Seleccionar</span>
    </button>
  </li>

  <li class="pdp-attr">
    <button type="button" class="pdp-attr__btn" id="pdpSizeBtn" aria-haspopup="dialog">
      <span class="pdp-attr__label">Talla</span>
      <span class="pdp-attr__value" id="pdpSizeVal">Seleccionar</span>
    </button>
  </li>
</ul>

        <!-- Links (abren side panel con tabs) -->
<div class="pdp-links">
  <button type="button" class="pdp-rowbtn" data-open="details" data-tab="details">
    <span>Todos los detalles</span><span aria-hidden="true">›</span>
  </button>

  <button type="button" class="pdp-rowbtn" data-open="fit-guide" data-tab="fit-guide">
    <span>Guía Inteligente de Talla</span><span aria-hidden="true">›</span>
  </button>
</div>


        
        <!-- CTA -->
<form id="buyForm" class="pdp-buy">
  <button id="pdpCta" type="button" class="btn-primary">
  <span class="pdp-cta__label">Seleccionar talla</span>
  <span class="pdp-cta__price" id="pdpCtaPrice">—</span>
</button>

</form>


      </div>

 
  </div>

  
  <!-- Side panel atributos (Talla / Color) -->
  <!-- Modal atributos (centrado, fade-in) -->
<div id="attrDrawer" class="ad" aria-hidden="true" role="dialog" aria-modal="true">
  <div class="ad-backdrop" data-ad-close></div>
  <aside class="ad-panel" role="document" aria-labelledby="adTitle">
    <header class="ad-head">
      <h3 id="adTitle" class="ad-title">Selecciona</h3>
      <button class="ad-close" type="button" data-ad-close aria-label="Cerrar">×</button>
    </header>
        <nav id="adTabs" class="ad-tabs" aria-label="Secciones" hidden></nav>

    <div id="adBody" class="ad-body"></div>
  </aside>
</div>








  <!-- Zoom PDP -->
    <!-- Zoom PDP (con tira de miniaturas) -->
  <div id="pdpZoom" class="lb hidden" aria-hidden="true" role="dialog">
    <div class="lb-backdrop" data-lb-close></div>
    <figure class="lb-figure">
      <button class="lb-close" id="pdpZoomClose" aria-label="Cerrar">&times;</button>
      <img id="pdpZoomImg" class="lb-img" alt="Imagen ampliada del producto">
      <button class="lb-prev"  id="pdpZoomPrev"  aria-label="Anterior">‹</button>
      <button class="lb-next"  id="pdpZoomNext"  aria-label="Siguiente">›</button>

      <!-- tira vertical de thumbs -->
      <ul id="pdpZoomThumbs" class="lb-thumbs" aria-label="Otras imágenes"></ul>
    </figure>
  </div>

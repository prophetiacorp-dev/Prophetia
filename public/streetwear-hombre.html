      data-bc-current="Streetwear">


  <!-- ====== Header (inyectado por parciales) ====== -->
  <div id="header" role="banner" aria-label="Cabecera"></div>

<main id="main" tabindex="-1">
  <h1 class="sr-only">Streetwear de lujo para hombre</h1>
    <!-- ====================== HERO · STREETWEAR ====================== -->
    <section class="pp-hero hero--two-cols" aria-label="Streetwear hombre">
      <div class="pp-hero__media">
        <!-- Logo urbano: tm.svg -->
        <a class="floating-logo" href="/home" aria-label="Inicio Prophetia">
  <img src="assets/img/logo/propnegrovf.svg" alt="PROPHETIA">
</a>
      </div>
<nav class="pp-breadcrumb pp-breadcrumb--hero" aria-label="breadcrumbs"></nav>

      <aside class="pp-hero__side">
        <h2 class="pp-hero__title">Streetwear</h2>
        <nav class="pp-hero__nav" aria-label="Categorías">
          <ul class="pp-hero__list">
<li><a href="/hoodies">Hoodies</a></li>
            <li><a href="camisetas-punto-hombre" aria-current="page">Camisetas de punto</a></li>
            <li><a href="sudaderas-punto-hombre">Sudaderas de punto</a></li>
          </ul>
        </nav>
      </aside>
    </section>

    <!-- Espaciador bajo la franja (como Prophetia) -->
    <div class="bb-spacer" aria-hidden="true"></div>

    <!-- ======================= CONTENIDO PLP ======================= -->
    <div class="pp-collection-page">
      <!-- HERO SUBTÍTULO -->
      <section class="pp-collection-hero container" aria-labelledby="pp-hero-title">
        <h3 id="pp-hero-title" class="pp-hero-title"></h3>
        <p class="pp-hero-sub">
          
        </p>
      </section>

      <!-- ===== Barra superior de filtros / ordenar ===== -->
      <section class="pp-filters container" aria-label="Filtros y orden">
        <div class="pp-filter-left">
          <button
            id="menOpenFilters"
            type="button"
            class="pp-btn"
            aria-haspopup="dialog"
            aria-controls="menFiltersDrawer"
          >
            Filtros
          </button>
      <div id="menSortControl" class="pp-sort">
        <button id="menSortButton" type="button" class="pp-btn pp-sort-trigger" aria-haspopup="listbox" aria-expanded="false" aria-controls="menSortMenu">
          Ordenar por
        </button>
        <div id="menSortMenu" class="pp-sort-menu" role="listbox" aria-labelledby="menSortButton" hidden>
          <button type="button" role="option" class="pp-sort-option is-active" data-sort="relevance" aria-selected="true">Destacados</button>
          <button type="button" role="option" class="pp-sort-option" data-sort="best-selling" aria-selected="false">Más vendidos</button>
          <button type="button" role="option" class="pp-sort-option" data-sort="name-asc" aria-selected="false">Alfabéticamente, A-Z</button>
          <button type="button" role="option" class="pp-sort-option" data-sort="name-desc" aria-selected="false">Alfabéticamente, Z-A</button>
          <button type="button" role="option" class="pp-sort-option" data-sort="price-asc" aria-selected="false">Precio, menor a mayor</button>
          <button type="button" role="option" class="pp-sort-option" data-sort="price-desc" aria-selected="false">Precio, mayor a menor</button>
          <button type="button" role="option" class="pp-sort-option" data-sort="oldest" aria-selected="false">Fecha, antiguos primero</button>
          <button type="button" role="option" class="pp-sort-option" data-sort="newest" aria-selected="false">Fecha, recientes primero</button>
        </div>
      </div>
        </div>
        <div class="pp-filter-right">
          <label class="pp-check">
            <input type="checkbox" /> <span>En stock</span>
          </label>
          <button type="button" class="pp-btn" aria-pressed="false">Vista</button>
        </div>
      </section>

      <!-- =======================
           DRAWER DE FILTROS STREETWEAR (color + talla)
           ======================= -->
      <div id="menFiltersOverlay" class="men-filters-overlay" aria-hidden="true"></div>

      <aside id="menFiltersDrawer"
             class="men-filters-drawer"
             aria-hidden="true"
             aria-label="Filtros de streetwear">
        <header class="men-filters-head">
          <div class="men-filters-head-top">
            <span class="men-filters-title">Filtros</span>
            <button class="men-filters-close"
                    type="button"
                    id="menCloseFilters"
                    aria-label="Cerrar filtros">×</button>
          </div>

          <nav class="men-filters-tabs" role="tablist">
            <button class="men-filters-tab is-active"
                    type="button"
                    data-tab="color"
                    aria-selected="true">
              COLOR <span id="menTabColorCount" class="men-tab-count"></span>
            </button>

            <button class="men-filters-tab"
                    type="button"
                    data-tab="talla"
                    aria-selected="false">
              TALLA <span id="menTabSizeCount" class="men-tab-count"></span>
            </button>
          </nav>
        </header>

        <div class="men-filters-body">
          <!-- PANEL COLOR -->
          <section class="men-filters-panel is-active"
                   data-panel="color"
                   role="tabpanel"
                   aria-label="Filtrar por color">

            <ul class="men-swatch-list">
              <!-- Colores pensados para streetwear (mismos nombres/clases que en camisetas-punto-hombre para reutilizar CSS) -->
              <li>
                <label class="men-swatch">
                  <input class="men-swatch-input" type="checkbox" value="blanco">
                  <span class="men-swatch-dot men-swatch--white"></span>
                  <span class="men-swatch-label">Blanco</span>
                </label>
              </li>
              <li>
                <label class="men-swatch">
                  <input class="men-swatch-input" type="checkbox" value="negro">
                  <span class="men-swatch-dot men-swatch--black"></span>
                  <span class="men-swatch-label">Negro</span>
                </label>
              </li>
              <li>
                <label class="men-swatch">
                  <input class="men-swatch-input" type="checkbox" value="beige">
                  <span class="men-swatch-dot men-swatch--beige"></span>
                  <span class="men-swatch-label">Beige</span>
                </label>
              </li>
              <li>
                <label class="men-swatch">
                  <input class="men-swatch-input" type="checkbox" value="verde">
                  <span class="men-swatch-dot men-swatch--green"></span>
                  <span class="men-swatch-label">Verde</span>
                </label>
              </li>
              <li>
                <label class="men-swatch">
                  <input class="men-swatch-input" type="checkbox" value="azul">
                  <span class="men-swatch-dot men-swatch--blue"></span>
                  <span class="men-swatch-label">Azul</span>
                </label>
              </li>
              <li>
                <label class="men-swatch">
                  <input class="men-swatch-input" type="checkbox" value="rojo">
                  <span class="men-swatch-dot men-swatch--red"></span>
                  <span class="men-swatch-label">Rojo</span>
                </label>
              </li>
              <li>
                <label class="men-swatch">
                  <input class="men-swatch-input" type="checkbox" value="naranja">
                  <span class="men-swatch-dot men-swatch--orange"></span>
                  <span class="men-swatch-label">Naranja</span>
                </label>
              </li>
              <li>
                <label class="men-swatch">
                  <input class="men-swatch-input" type="checkbox" value="multicolor">
                  <span class="men-swatch-dot men-swatch--multi"></span>
                  <span class="men-swatch-label">Multicolor</span>
                </label>
              </li>
            </ul>
          </section>

          <!-- PANEL TALLA -->
          <section class="men-filters-panel"
                   data-panel="talla"
                   role="tabpanel"
                   aria-label="Filtrar por talla">

            <label class="men-check"><input type="checkbox" name="size" value="S"><span>S</span></label>
            <label class="men-check"><input type="checkbox" name="size" value="M"><span>M</span></label>
            <label class="men-check"><input type="checkbox" name="size" value="L"><span>L</span></label>
            <label class="men-check"><input type="checkbox" name="size" value="XL"><span>XL</span></label>
            <label class="men-check"><input type="checkbox" name="size" value="XXL"><span>XXL</span></label>

          </section>
        </div>

        <footer class="men-filters-foot">
          <div class="men-filters-foot-inner">
            <button id="menClearFilters"
                    class="men-filters-clear"
                    type="button">
              Eliminar filtros
              <span id="menActiveCount" class="men-filters-count"></span>
            </button>

            <button id="menApplyFilters"
                    class="men-filters-cta"
                    type="button">
              Ver <span id="menResultsCount">0</span> resultados
            </button>
          </div>
        </footer>
      </aside>

      <!-- GRID PRODUCTOS -->
      <section class="pp-plp container" aria-live="polite">
        <div id="plp-grid" class="plp-grid" data-source="json" data-catalog="assets/data/catalog.json" data-section="streetwear" data-gender="hombre"></div>

      </section>

      <!-- ======================= TOAST / AVISO ======================= -->
      <div id="ppToast" class="pp-toast" role="status" aria-live="polite" hidden>
        <div class="pp-toast__inner">
          <span id="ppToastMsg">Añadido a artículos guardados</span>
          <a id="ppToastAction" class="pp-toast__cta" href="/wishlist">Ver</a>
        </div>
      </div>

      <!-- Padding final estilo Prophetia -->
      <div class="pp-bottom-space" aria-hidden="true"></div>
    </div>

  </main>

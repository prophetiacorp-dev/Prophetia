<aside id="womenFiltersDrawer"

        <li><label class="women-swatch"><input class="women-swatch-input" type="checkbox" value="blanco"><span class="women-swatch-dot women-swatch--white"></span><span class="women-swatch-label">Blanco</span></label></li>
        <li><label class="women-swatch"><input class="women-swatch-input" type="checkbox" value="negro"><span class="women-swatch-dot women-swatch--black"></span><span class="women-swatch-label">Negro</span></label></li>
        <li><label class="women-swatch"><input class="women-swatch-input" type="checkbox" value="beige"><span class="women-swatch-dot women-swatch--beige"></span><span class="women-swatch-label">Beige</span></label></li>
        <li><label class="women-swatch"><input class="women-swatch-input" type="checkbox" value="verde"><span class="women-swatch-dot women-swatch--green"></span><span class="women-swatch-label">Verde</span></label></li>
        <li><label class="women-swatch"><input class="women-swatch-input" type="checkbox" value="azul"><span class="women-swatch-dot women-swatch--blue"></span><span class="women-swatch-label">Azul</span></label></li>
        <li><label class="women-swatch"><input class="women-swatch-input" type="checkbox" value="rojo"><span class="women-swatch-dot women-swatch--red"></span><span class="women-swatch-label">Rojo</span></label></li>
        <li><label class="women-swatch"><input class="women-swatch-input" type="checkbox" value="naranja"><span class="women-swatch-dot women-swatch--orange"></span><span class="women-swatch-label">Naranja</span></label></li>
        <li><label class="women-swatch"><input class="women-swatch-input" type="checkbox" value="multicolor"><span class="women-swatch-dot women-swatch--multi"></span><span class="women-swatch-label">Multicolor</span></label></li>
      </ul>
    </section>

    <section class="women-filters-panel"
             data-panel="talla"
             role="tabpanel"
             aria-label="Filtrar por talla">
      <label class="women-check"><input type="checkbox" name="size" value="S"><span>S</span></label>
      <label class="women-check"><input type="checkbox" name="size" value="M"><span>M</span></label>
      <label class="women-check"><input type="checkbox" name="size" value="L"><span>L</span></label>
      <label class="women-check"><input type="checkbox" name="size" value="XL"><span>XL</span></label>
      <label class="women-check"><input type="checkbox" name="size" value="XXL"><span>XXL</span></label>

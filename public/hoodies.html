    <div class="pp-collection-page">

        <h3 id="pp-hero-title" class="pp-hero-title">Hoodies · Silent Luxury Hombre</h3>

         <!--Sudaderas urbanas: volumen limpio, tacto premium y gráficos Prophetia para la calle. -->

      <!-- ===== Barra superior de filtros / ordenar ===== -->
      <section class="pp-filters container" aria-label="Filtros y orden">
        <div class="pp-filter-left">
          <button
            id="menOpenFilters"
            type="button"
            class="pp-btn"
            aria-haspopup="dialog"
            aria-controls="menFiltersDrawer"
          >
            Filtros
          </button>
         <div id="menSortControl" class="pp-sort">
           <button id="menSortButton" type="button" class="pp-btn pp-sort-trigger" aria-haspopup="listbox" aria-expanded="false" aria-controls="menSortMenu">
             Ordenar por
           </button>
           <div id="menSortMenu" class="pp-sort-menu" role="listbox" aria-labelledby="menSortButton" hidden>
             <button type="button" role="option" class="pp-sort-option is-active" data-sort="relevance" aria-selected="true">Destacados</button>
             <button type="button" role="option" class="pp-sort-option" data-sort="best-selling" aria-selected="false">Más vendidos</button>
             <button type="button" role="option" class="pp-sort-option" data-sort="name-asc" aria-selected="false">Alfabéticamente, A-Z</button>
             <button type="button" role="option" class="pp-sort-option" data-sort="name-desc" aria-selected="false">Alfabéticamente, Z-A</button>
             <button type="button" role="option" class="pp-sort-option" data-sort="price-asc" aria-selected="false">Precio, menor a mayor</button>
             <button type="button" role="option" class="pp-sort-option" data-sort="price-desc" aria-selected="false">Precio, mayor a menor</button>
             <button type="button" role="option" class="pp-sort-option" data-sort="oldest" aria-selected="false">Fecha, antiguos primero</button>
             <button type="button" role="option" class="pp-sort-option" data-sort="newest" aria-selected="false">Fecha, recientes primero</button>
           </div>
         </div>
        </div>

        <div class="pp-filter-right">
          <label class="pp-check">
            <input type="checkbox" /> <span>En stock</span>
          </label>
          <button type="button" class="pp-btn" aria-pressed="false">Vista</button>
        </div>
      </section>

      <!-- =======================
           DRAWER DE FILTROS (color + talla)
           ======================= -->
      <div id="menFiltersOverlay" class="men-filters-overlay" aria-hidden="true"></div>

      <aside id="menFiltersDrawer"
             class="men-filters-drawer"
             aria-hidden="true"
             aria-label="Filtros de hoodies">
        <header class="men-filters-head">
          <div class="men-filters-head-top">
            <span class="men-filters-title">Filtros</span>
            <button class="men-filters-close"
                    type="button"
                    id="menCloseFilters"
                    aria-label="Cerrar filtros">×</button>
          </div>

          <nav class="men-filters-tabs" role="tablist">
            <button class="men-filters-tab is-active"
                    type="button"
                    data-tab="color"
                    aria-selected="true">
              COLOR <span id="menTabColorCount" class="men-tab-count"></span>
            </button>

            <button class="men-filters-tab"
                    type="button"
                    data-tab="talla"
                    aria-selected="false">
              TALLA <span id="menTabSizeCount" class="men-tab-count"></span>
            </button>
          </nav>
        </header>

        <div class="men-filters-body">
          <!-- PANEL COLOR -->
          <section class="men-filters-panel is-active"
                   data-panel="color"
                   role="tabpanel"
                   aria-label="Filtrar por color">

            <ul class="men-swatch-list">
              <li><label class="men-swatch"><input class="men-swatch-input" type="checkbox" value="blanco"><span class="men-swatch-dot men-swatch--white"></span><span class="men-swatch-label">Blanco</span></label></li>
              <li><label class="men-swatch"><input class="men-swatch-input" type="checkbox" value="negro"><span class="men-swatch-dot men-swatch--black"></span><span class="men-swatch-label">Negro</span></label></li>
              <li><label class="men-swatch"><input class="men-swatch-input" type="checkbox" value="beige"><span class="men-swatch-dot men-swatch--beige"></span><span class="men-swatch-label">Beige</span></label></li>
              <li><label class="men-swatch"><input class="men-swatch-input" type="checkbox" value="verde"><span class="men-swatch-dot men-swatch--green"></span><span class="men-swatch-label">Verde</span></label></li>
              <li><label class="men-swatch"><input class="men-swatch-input" type="checkbox" value="azul"><span class="men-swatch-dot men-swatch--blue"></span><span class="men-swatch-label">Azul</span></label></li>
              <li><label class="men-swatch"><input class="men-swatch-input" type="checkbox" value="rojo"><span class="men-swatch-dot men-swatch--red"></span><span class="men-swatch-label">Rojo</span></label></li>
              <li><label class="men-swatch"><input class="men-swatch-input" type="checkbox" value="naranja"><span class="men-swatch-dot men-swatch--orange"></span><span class="men-swatch-label">Naranja</span></label></li>
              <li><label class="men-swatch"><input class="men-swatch-input" type="checkbox" value="multicolor"><span class="men-swatch-dot men-swatch--multi"></span><span class="men-swatch-label">Multicolor</span></label></li>
            </ul>
          </section>

          <!-- PANEL TALLA -->
          <section class="men-filters-panel"
                   data-panel="talla"
                   role="tabpanel"
                   aria-label="Filtrar por talla">
            <label class="men-check"><input type="checkbox" name="size" value="S"><span>S</span></label>
            <label class="men-check"><input type="checkbox" name="size" value="M"><span>M</span></label>
            <label class="men-check"><input type="checkbox" name="size" value="L"><span>L</span></label>
            <label class="men-check"><input type="checkbox" name="size" value="XL"><span>XL</span></label>
            <label class="men-check"><input type="checkbox" name="size" value="XXL"><span>XXL</span></label>
          </section>
        </div>

        <footer class="men-filters-foot">
          <div class="men-filters-foot-inner">
            <button id="menClearFilters" class="men-filters-clear" type="button">
              Eliminar filtros <span id="menActiveCount" class="men-filters-count"></span>
            </button>

            <button id="menApplyFilters" class="men-filters-cta" type="button">
              Ver <span id="menResultsCount">0</span> resultados
            </button>
          </div>
        </footer>
      </aside>

      <!-- GRID PRODUCTOS -->
      <section class="pp-plp container" aria-live="polite">
        <div id="plp-grid" class="plp-grid" data-section="hoodies" data-gender="hombre"></div>

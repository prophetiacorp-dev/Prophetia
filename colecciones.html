<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PROPHETIA · Colecciones</title>

  <!-- CSS principal -->
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body class="collections-page">
  <!-- Parcial: header (lo inyectamos por JS) -->
  <div id="header"></div>

  <!-- ======================= FRANJA DEL LOGO ======================= -->
  <div class="brand-band">
    <div class="container">
      <a class="page-logo" href="index.html" aria-label="Inicio Prophetia">
        <img src="assets/img/logo/propnegro.png" alt="PROPHETIA" />
      </a>
    </div>
  </div>
  <!-- =============================================================== -->

  <main class="section-gap">
    <div class="container">
      <!-- Grid 2 columnas: Myth Series / Letters From The Soul -->
      <div class="tiles" style="grid-template-columns: repeat(2, minmax(0,1fr));">
        <!-- MYTH SERIES -->
        <a class="tile" href="assets/collects/ms.html" aria-label="Ver colección Myth Series">
          <div class="tile-body">
            <h3 class="tile-title">Myth Series</h3>
            <p class="tile-sub">Arquetipos griegos, forja olímpica y lujo editorial.</p>
          </div>
        </a>

        <!-- LETTERS FROM THE SOUL -->
        <a class="tile" href="assets/collects/lfts.html" aria-label="Ver colección Letters From The Soul">
          <div class="tile-body">
            <h3 class="tile-title">Letters From The Soul</h3>
            <p class="tile-sub">Manifiesto tipográfico sagrado. Silencio y proporción.</p>
          </div>
        </a>
      </div>
    </div>
  </main>

  <!-- Parcial: footer -->
  <div id="footer"></div>

  <!-- ====== CART: overlay + drawer (igual que index/camisetas) ====== -->
  <div id="cartOverlay" class="cart-overlay" hidden></div>
  <aside id="cartDrawer" class="cart-drawer" aria-hidden="true" role="dialog" aria-label="Cesta">
    <div class="cart-head">
      <strong>Cesta · <span id="cartCount">0</span></strong>
      <button id="cartClose" class="cart-close" aria-label="Cerrar">✕</button>
    </div>
    <div class="cart-list" id="cartList"></div>
    <div class="cart-foot">
      <div class="cart-total">
        <span>Subtotal</span>
        <strong id="cartSubtotal">0,00 €</strong>
      </div>
      <button class="cart-checkout" id="cartCheckout">Finalizar compra</button>
    </div>
  </aside>

  <!-- JS base -->
  <script src="assets/js/header-init.js" defer></script>
  <script src="assets/js/script.js" defer></script>
  <script src="assets/js/cart.js"></script>

  <!-- Inyección de parciales + init header + carrito -->
  <script>
    (async function injectHF(){
      try{
        const [H, F] = await Promise.all([
          fetch('assets/partials/header.html').then(r=>r.text()),
          fetch('assets/partials/footer.html').then(r=>r.text())
        ]);
        const $H = document.getElementById('header');
        const $F = document.getElementById('footer');
        if ($H) $H.innerHTML = H;
        if ($F) $F.innerHTML = F;

        // Header (menús, buscador, auth panel…)
        window.ppInitHeader && window.ppInitHeader();

        // Carrito
        window.ppCartInit && window.ppCartInit();

        // Evento de compatibilidad
        window.dispatchEvent(new CustomEvent('partials:ready'));
      }catch(err){
        console.error('Error inyectando header/footer:', err);
      }
    })();
  </script>
</body>
</html>

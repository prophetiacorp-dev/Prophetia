<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <base href="../">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PROPHETIA · Letters From The Soul</title>

  <!-- desde /assets/collects → /assets/css -->
  <link rel="stylesheet" href="assets/css/style.css?v=25">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body class="collection-page" data-collection="letters-from-the-soul">
  <!-- Header inyectado -->
  <div id="header"></div>

  <!-- Franja con logo que lleva a Home -->
  <div class="brand-band">
    <div class="container">
      <!-- desde /assets/collects → raíz -->
    <a class="page-logo" href="../../index.html">

        <!-- desde /assets/collects → /assets/img -->
        <img src="../img/logo/propnegro.png" alt="PROPHETIA">
      </a>
    </div>
  </div>

  <main class="section-gap">
    <div class="container">
      <header class="page-head">
        <h1 class="h1">Letters From The Soul</h1>
        <p class="lead">Manifiesto tipográfico sagrado — silencio, proporción y oro editorial.</p>
      </header>

      <div class="tiles">
        <!-- producto.html está en la raíz → ../../ -->
        <a class="tile" href="producto.html?id=likegods">
          <div class="tile-body">
            <h2 class="tile-title">Like Gods - Prophetia ®</h2>
            <p class="tile-sub">Texto sagrado, serif Prophetia.</p>
          </div>
        </a>

        <a class="tile" href="../../producto.html?id=silent-luxury-type">
          <div class="tile-body">
            <h2 class="tile-title">Letter From the Self - Prophetia ®</h2>
            <p class="tile-sub">Tipografía Prophetia curada.</p>
          </div>
        </a>

        <a class="tile" href="../../producto.html?id=letters-sigil">
          <div class="tile-body">
            <h2 class="tile-title">Letters Sigil</h2>
            <p class="tile-sub">Sello místico editorial.</p>
          </div>
        </a>
      </div>
    </div>
  </main>

  <!-- Footer inyectado -->
  <div id="footer"></div>

  <!-- CART overlay + drawer -->
  <div id="cartOverlay" class="cart-overlay" hidden></div>
  <aside id="cartDrawer" class="cart-drawer" aria-hidden="true" role="dialog" aria-label="Cesta">
    <div class="cart-head">
      <strong>Cesta · <span id="cartCount">0</span></strong>
      <button id="cartClose" class="cart-close" aria-label="Cerrar">✕</button>
    </div>
    <div class="cart-list" id="cartList"></div>
    <div class="cart-foot">
      <div class="cart-total">
        <span>Subtotal</span>
        <strong id="cartSubtotal">0,00 €</strong>
      </div>
      <button class="cart-checkout" id="cartCheckout">Finalizar compra</button>
    </div>
  </aside>

  <!-- JS (desde /assets/collects → /assets/js) -->
  <script src="js/header-init.js" defer></script>
<script src="js/script.js" defer></script>
<script src="js/cart.js"></script>

  <!-- Inyección de parciales (desde /assets/collects → /assets/partials) -->
  <script>
    (async function injectHF(){
      const [H, F] = await Promise.all([
       fetch('partials/header.html').then(r=>r.text()),
        fetch('partials/footer.html').then(r=>r.text())
      ]);
      document.getElementById('header').innerHTML = H;
      document.getElementById('footer').innerHTML = F;

      window.ppInitHeader && window.ppInitHeader();
      window.ppCartInit && window.ppCartInit();
      window.dispatchEvent(new CustomEvent('partials:ready'));
    })();
  </script>
</body>
</html>

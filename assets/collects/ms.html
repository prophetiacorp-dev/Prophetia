<!doctype html>
<html lang="es">
<head>
  <!-- fija la base para resolver rutas como si estuviéramos en la raíz -->
  <base href="../">

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Myth Series — PROPHETIA</title>

  <!-- SEO / OG (mismo patrón que el resto) -->
  <meta name="description" content="Moda editorial mediterránea. Colecciones místicas, lujo silencioso y arte cultural.">
  <link rel="canonical" href="https://prophetia.es/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PROPHETIA">
  <meta property="og:title" content="PROPHETIA — Silent Luxury Mediterráneo">
  <meta property="og:description" content="Moda editorial mediterránea y mística.">
  <meta property="og:url" content="https://prophetia.es/">
  <meta property="og:image" content="https://prophetia.es/assets/img/og-cover.jpg">
  <meta property="og:locale" content="es_ES">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="PROPHETIA — Silent Luxury Mediterráneo">
  <meta name="twitter:description" content="Arte y moda editorial desde el alma del Mediterráneo.">
  <meta name="twitter:image" content="https://prophetia.es/assets/img/og-cover.jpg">

  <link rel="icon" href="favicon.ico" />
  <link rel="stylesheet" href="assets/css/style.css?v=25">
</head>

<body class="colecciones-page" data-page="ms">
  <!-- Header (inyectado por JS) -->
  <div id="header"></div>

  <main id="swup" class="cat-layout" data-page="ms">
    <!-- BRAND BAND (idéntica al resto) -->
    <div class="brand-band">
      <div class="container">
        <a class="page-logo" href="index.html" aria-label="Inicio Prophetia">
          <img src="assets/img/logo/propnegro.svg" alt="PROPHETIA">
        </a>
      </div>
    </div>

    <!-- CONTENIDO -->
    <section class="section-gap">
      <div class="container">
        <header class="page-head">
          <h1 class="h1">Myth Series</h1>
          <p class="lead">Arquetipos griegos, forja olímpica y lujo editorial.</p>
        </header>

        <!-- tiles editoriales (links relativos, sin “/”) -->
        <div class="tiles">
          <a class="tile" href="producto.html?id=apollo-seal">
            <div class="tile-body">
              <h3 class="tile-title">Atlas By Prophetia</h3>
              <p class="tile-sub">Líneas laberínticas en oro mate.</p>
            </div>
          </a>

          <a class="tile" href="producto.html?id=eternal-forge">
            <div class="tile-body">
              <h3 class="tile-title">Calyra's Ego By Prophetia</h3>
              <p class="tile-sub">Mito olímpico minimalista.</p>
            </div>
          </a>

          <a class="tile" href="producto.html?id=gaia-pulse">
            <div class="tile-body">
              <h3 class="tile-title">Gaia’s Pulse</h3>
              <p class="tile-sub">Energía sagrada en trazo editorial.</p>
            </div>
          </a>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer (inyectado por JS) -->
  <div id="footer"></div>

  <!-- CART (mismo orden de scripts que PDP) -->
  <div id="cartOverlay" class="cart-overlay" hidden></div>
  <aside id="cartDrawer" class="cart-drawer" aria-hidden="true" role="dialog" aria-label="Cesta">
    <div class="cart-head">
      <strong>Cesta · <span id="cartCount">0</span></strong>
      <button id="cartClose" class="cart-close" aria-label="Cerrar">✕</button>
    </div>
    <div class="cart-list" id="cartList"></div>
    <div class="cart-foot">
      <div class="cart-total">
        <span>Subtotal</span>
        <strong id="cartSubtotal">0,00 €</strong>
      </div>
      <button class="cart-checkout" id="cartCheckout">Finalizar compra</button>
    </div>
  </aside>

  <!-- JS (idéntico al resto gracias a <base>) -->
<script src="js/cart.js" defer></script>
<script src="js/header-init.js" defer></script>
<script src="js/script.js" defer></script>


  <!-- Inyección de parciales -->
  <script>
    (async function injectHF(){
      const [H, F] = await Promise.all([
        fetch('partials/header.html').then(r => r.text()),
        fetch('partials/footer.html').then(r => r.text())
      ]);
      document.getElementById('header').innerHTML = H;
      document.getElementById('footer').innerHTML = F;
      window.ppInitHeader && window.ppInitHeader();
      window.ppCartInit && window.ppCartInit();
      window.dispatchEvent(new CustomEvent('partials:ready'));
    })();
  </script>
</body>
</html>

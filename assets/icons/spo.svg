<!-- Prophetia — Abstract Spotify Seal (8K, transparent, vector-only) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8192 8192" role="img" aria-labelledby="t d">
  <title id="t">Prophetia — Abstract Spotify Seal</title>
  <desc id="d">Emblema editorial circular con tres ondas musicales al estilo Prophetia, oro envejecido y carbón.</desc>

  <!-- ====== Palette & base styles (editable) ====== -->
  <defs>
    <style>
      :root{ --gold:#C1A45F; --ink:#111111; }
      .ring{ fill:none; stroke:var(--ink); stroke-width:210; }
      .gold{ fill:none; stroke:var(--gold); stroke-linecap:round; stroke-linejoin:round; }
      .mark{ fill:var(--gold); }
    </style>

    <!-- Sutiles rayas editoriales (trama radial elegante) -->
    <mask id="radialCuts">
      <rect width="100%" height="100%" fill="#fff"></rect>
      <g stroke="#000" stroke-width="120" opacity=".12">
        <!-- 36 radios sutiles -->
        <g transform="translate(4096 4096)">
          <!-- Generamos 36 líneas con rotaciones de 10° -->
          <g id="ray">
            <path d="M0,-3780 L0,-4096"></path>
          </g>
          <use href="#ray" transform="rotate(10)"></use>
          <use href="#ray" transform="rotate(20)"></use>
          <use href="#ray" transform="rotate(30)"></use>
          <use href="#ray" transform="rotate(40)"></use>
          <use href="#ray" transform="rotate(50)"></use>
          <use href="#ray" transform="rotate(60)"></use>
          <use href="#ray" transform="rotate(70)"></use>
          <use href="#ray" transform="rotate(80)"></use>
          <use href="#ray" transform="rotate(90)"></use>
          <use href="#ray" transform="rotate(100)"></use>
          <use href="#ray" transform="rotate(110)"></use>
          <use href="#ray" transform="rotate(120)"></use>
          <use href="#ray" transform="rotate(130)"></use>
          <use href="#ray" transform="rotate(140)"></use>
          <use href="#ray" transform="rotate(150)"></use>
          <use href="#ray" transform="rotate(160)"></use>
          <use href="#ray" transform="rotate(170)"></use>
          <use href="#ray" transform="rotate(180)"></use>
          <use href="#ray" transform="rotate(190)"></use>
          <use href="#ray" transform="rotate(200)"></use>
          <use href="#ray" transform="rotate(210)"></use>
          <use href="#ray" transform="rotate(220)"></use>
          <use href="#ray" transform="rotate(230)"></use>
          <use href="#ray" transform="rotate(240)"></use>
          <use href="#ray" transform="rotate(250)"></use>
          <use href="#ray" transform="rotate(260)"></use>
          <use href="#ray" transform="rotate(270)"></use>
          <use href="#ray" transform="rotate(280)"></use>
          <use href="#ray" transform="rotate(290)"></use>
          <use href="#ray" transform="rotate(300)"></use>
          <use href="#ray" transform="rotate(310)"></use>
          <use href="#ray" transform="rotate(320)"></use>
          <use href="#ray" transform="rotate(330)"></use>
          <use href="#ray" transform="rotate(340)"></use>
          <use href="#ray" transform="rotate(350)"></use>
        </g>
      </g>
    </mask>
  </defs>

  <!-- ====== Outer editorial ring (con micro-meandros) ====== -->
  <g mask="url(#radialCuts)">
    <circle cx="4096" cy="4096" r="3800" class="ring"></circle>
    <!-- cuatro muescas doradas tipo “editorial cut” -->
    <g class="gold" stroke-width="150" opacity=".92">
      <path d="M4096 296 a3800 3800 0 0 1 960 120"></path>
      <path d="M7896 4096 a3800 3800 0 0 1 -120 960"></path>
      <path d="M4096 7896 a3800 3800 0 0 1 -960 -120"></path>
      <path d="M296 4096 a3800 3800 0 0 1 120 -960"></path>
    </g>
  </g>

  <!-- ====== Three abstract “waves” (Spotify insinuation, Prophetia finish) ====== -->
  <!-- Superior — trazo amplio y suave -->
  <path class="gold" stroke-width="260" opacity=".98" d="M 960 2750
           Q 2660 2000 4096 2000
           T 7232 2750"></path>

  <!-- Media — algo más cerrada -->
  <path class="gold" stroke-width="220" opacity=".92" d="M 1400 3440
           Q 2860 2900 4096 2900
           T 6792 3440"></path>

  <!-- Inferior — compacta y elegante -->
  <path class="gold" stroke-width="190" opacity=".86" d="M 1880 4040
           Q 3040 3700 4096 3700
           T 6312 4040"></path>

  <!-- Punto editorial central (sello Prophetia) -->
  <circle cx="4096" cy="4096" r="42" class="mark"></circle>

  <!-- Inner silent-luxury ring muy fino -->
  <circle cx="4096" cy="4096" r="3120" class="ring" style="stroke-width:70; opacity:.6"></circle>
</svg>
